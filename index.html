<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://adkecwrxjmmzqxnmwips.supabase.co; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://adkecwrxjmmzqxnmwips.supabase.co wss://adkecwrxjmmzqxnmwips.supabase.co https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://challenges.cloudflare.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Lord of the Mysteries RPG</title>
<link rel="stylesheet" href="css/style.css?v=b2-1">
</head>
<body>
<a class="pular" href="#app">Pular para o conteúdo</a>
<div id="anuncio" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="terror-frame" aria-hidden="true"></div>
<div class="fundo" aria-hidden="true"></div>
<div class="nevoa" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="estrela-cad" aria-hidden="true"></div>

<header class="topbar">
  <h1 class="logo" id="logo" title="Voltar à capa"><svg class="logo-em" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1"/><circle class="spin" cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-opacity=".6" stroke-dasharray="1.5 3.5"/><path d="M16 4l2.2 9.8L28 16l-9.8 2.2L16 28l-2.2-9.8L4 16l9.8-2.2z" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><span>Lord of the Mysteries <small>RPG</small></span></h1>
  <nav class="topnav">
    <button id="btn-terror" class="ghost icon" title="Modo Terror" aria-label="Modo Terror" aria-pressed="false"></button>
    <button id="btn-som" class="ghost icon" title="Som" aria-label="Som" aria-pressed="true"></button>
    <button id="btn-vol" class="ghost icon" title="Volume e sons" aria-label="Ajustes de som" aria-haspopup="dialog" aria-expanded="false" aria-controls="painel-som"></button>
    <button id="btn-pers" class="ghost" data-ic="pessoas" aria-label="Meus personagens"><span class="tx">Personagens</span></button>
    <button id="btn-import" class="ghost" data-ic="subir" aria-label="Importar JSON"><span class="tx">Importar JSON</span></button>
    <input id="file-import" type="file" accept="application/json" hidden>
  </nav>
</header>

<main id="app" tabindex="-1">
  <section id="cover" class="cover">
    <div class="orbit-stage" id="orbit-stage">
      <div class="orbit" id="orbit" aria-hidden="true"></div>
      <div class="cover-core">
        <p class="eyebrow">Quem é Você?</p>
        <h2 class="title">O Louco que Caminha<br>entre os Mistérios</h2>
        <p class="lead">Crie seu Beyonder: role os dados do destino e dê o primeiro passo no Caminho.</p>
        <div class="cover-btns">
          <button id="btn-start" class="primary big" data-ic="estrela">Iniciar a jornada</button>
          <button id="btn-continue" class="ghost" data-ic="livro" hidden><span id="continue-txt">Continuar personagem salvo</span></button>
          <button id="btn-lib" class="ghost" data-ic="pessoas" hidden><span id="lib-txt">Meus personagens</span></button>
        </div>
        <p id="cover-saved" class="cover-saved" hidden></p>
        <div class="cover-mestre">
          <button type="button" id="btn-entrar-mesa" class="cm-link">Tem o código do mestre? <span>Entrar numa mesa</span></button>
          <a href="mestre.html" class="cm-link">Vai conduzir a sessão? <span>Abrir o Grimório do Mestre</span></a>
        </div>
      </div>
    </div>
  </section>

  <section id="wizard" hidden>
    <ol id="stepper" class="stepper"></ol>
    <div id="step-body" class="panel"></div>
    <div class="wizard-nav">
      <button id="btn-prev" class="ghost" data-ic="esq">Voltar</button>
      <button id="btn-next" class="primary" data-ic="dir" data-ic-end>Avançar</button>
    </div>
  </section>
</main>

<script src="js/icones.js"></script>
<script src="js/data.js"></script>
<script src="js/caminhos.js"></script>
<script src="js/mundo.js"></script>
<script src="js/emblemas.js"></script>
<script src="js/visual.js"></script>
<script src="js/som.js"></script>
<script src="js/efeitos.js"></script>
<script src="js/state.js"></script>
<script src="js/dice.js"></script>
<script src="js/constelacao.js"></script>
<script src="js/capa.js"></script>
<script src="js/retrato.js"></script>
<script src="js/poder.js"></script>
<script src="js/animar.js"></script>
<script src="js/dado3d.js"></script>
<script src="js/cenas.js"></script>
<script src="js/mesa.js"></script>
<script src="js/config.js"></script>
<script src="js/mestre.js"></script>
<script src="js/regras.js?v=b2-1"></script>
<script src="js/ficha-mesa.js?v=b2-1"></script>
<script src="js/jogador.js?v=b2-1"></script>
<script src="js/app.js"></script>
</body>
</html>
